<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Neon Drift — 縦シュー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game" aria-label="縦スクロールシューティングゲーム"></canvas>
  <div id="hud">
    <div class="hud-col">
      <span id="score">SCORE 0</span>
      <span id="chain" class="hud-sub">CHAIN —</span>
      <span id="hiscore" class="hud-sub">HI 0</span>
    </div>
    <span id="lives">♥♥♥</span>
    <div class="hud-col hud-col-right">
      <span id="wave">WAVE 1</span>
      <span id="bombs" class="hud-sub">BOMB 2</span>
    </div>
  </div>
  <div id="overlay">
    <div class="panel">
      <h1 id="title">NEON DRIFT</h1>
      <p id="subtitle">WASD / タッチで移動 · Shift長押しでチャージ · B でボム</p>
      <button type="button" id="startBtn">スタート</button>
      <button type="button" id="muteBtn" class="ghost-btn">BGM: ON</button>
      <p class="hint">BGM は M でも切替 · FEVER / ボスで曲変化</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
